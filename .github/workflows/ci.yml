name: CI

# CI runs on GitHub-hosted runners, on master only: a branch is checked
# locally before it merges. A push that only touches docs, the phone app or
# other non-build files doesn't start a run; workflow_dispatch runs it all.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "mobile/**"
      - "design/**"
      - "LICENSE*"
      - ".github/workflows/mobile*.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/claude*.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time: a newer push cancels the older run, so
# runner time goes only to the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Property tests run with a fixed seed so a CI failure reproduces locally.
  PROPTEST_RNG_SEED: "20261017"
  # Hosted runners start with no target folder and limited disk: no
  # incremental files, and line tables only instead of full debug info.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # On a Mac: several tests need macOS's fonts and text system.
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The built-in themes: the kanso-themes repository.
          submodules: true
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: scripts/ci-rust.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # kanso-audio's libopus is built from the source the opus crate bundles,
      # with CMake (Linux has it from linux-deps.sh).
      - name: CMake (libopus)
        run: scripts/cmake-deps.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # bundle-macos.sh refuses a binary that links an OpenSSL outside
      # /usr/lib (issue #243): that check is itself tested here.
      - name: The OpenSSL link check works
        run: scripts/test-check-macos-crypto.sh
      # The engine's highlighter (kanso-engine) and the component library's
      # share one copy of tree-sitter and of each grammar: the runtime declares
      # `links = "tree-sitter"` and the grammars export unmangled C symbols, so
      # a second version of any of them does not link. `cargo tree -d` lists a
      # crate that is in the build twice at the left margin (the indented
      # lines are what depends on it, and tree-sitter depends on regex, which
      # is).
      - name: One copy of each tree-sitter crate
        run: |
          duplicated="$(cargo tree -d -p kanso-app --locked | grep -E '^tree-sitter' || true)"
          if [ -n "$duplicated" ]; then
            echo "$duplicated"
            echo "::error::A tree-sitter crate is in the build twice. Keep the requirements in Cargo.toml equal to gpui-component's."
            exit 1
          fi
      # The PDF worker needs its library, and its tests start the worker: it
      # is built with the render feature, and the app's PDF tests find it in
      # the target folder (issue #43).
      - name: PDFium
        run: scripts/fetch-pdfium.sh
      # PDF JavaScript runs in V8; the library in the build is the one
      # without it (issue #43, step 9).
      - name: PDFium is not a V8 build
        run: scripts/check-pdfium-no-v8.sh vendor/pdfium
      # With `render`, this also runs the hostile-PDF corpus through the real
      # worker (kanso-pdf/tests/hostile.rs).
      - run: cargo test --workspace --locked --features kanso-pdf/render

  # Encrypting the library costs little (issue #243, step 14): a 150 MB
  # library opens, searches, saves and backs up within five times a plain
  # one's time (crates/kanso-store/tests/encryption_speed.rs). Slow, so it
  # has its own job and a release build.
  encryption-speed:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - run: scripts/ci-rust.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p kanso-store --release --locked --test encryption_speed -- --include-ignored --nocapture

  # The app and the command-line tools build for Windows and Linux too (the
  # release workflow ships them). The tests stay on the job above: several
  # need macOS's fonts and text system.
  portability:
    name: clippy + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: ubuntu-24.04
          - os: windows-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      # Keep LF line endings on Windows: the theme files and the
      # highlighter's fixtures are compared byte for byte.
      - name: LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The built-in themes: the kanso-themes repository.
          submodules: true
      # On Windows, plain `bash` can be WSL's launcher in
      # WindowsApps, which can't run the step scripts; put Git Bash first.
      # Git for Windows may be installed for every user (Program Files) or
      # only the runner's (AppData\Local\Programs), so look where git is too.
      - name: Git Bash first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Git\bin'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Git\bin')
          )
          $gitExe = (Get-Command git -ErrorAction SilentlyContinue).Source
          if ($gitExe) { $candidates += Join-Path (Split-Path (Split-Path $gitExe)) 'bin' }
          $git = $candidates | Where-Object { Test-Path (Join-Path $_ 'bash.exe') } | Select-Object -First 1
          if (-not $git) {
            Write-Output "::error::Git for Windows' bash.exe isn't in any of: $($candidates -join ', '). The build steps need it."
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $git -Encoding ascii
      # SQLCipher's vendored OpenSSL (issue #243) is configured with Perl, and
      # needs a native Windows one: Git Bash's Perl (MSYS) fails. Strawberry
      # Perl is installed when it isn't there, and OPENSSL_SRC_PERL points the
      # openssl-src build at it.
      - name: Strawberry Perl for OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # A self-hosted runner may name its own Windows Perl; otherwise
          # Strawberry's usual place.
          $candidates = @($env:OPENSSL_SRC_PERL, 'C:\Strawberry\perl\bin\perl.exe') | Where-Object { $_ }
          $perl = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $perl) {
            choco install strawberryperl --no-progress -y
            $perl = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $perl) {
            Write-Output "::error::Strawberry Perl isn't installed and could not be: the vendored OpenSSL build needs a Windows Perl. Install it from https://strawberryperl.com."
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_SRC_PERL=$perl" -Encoding ascii
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $perl) -Encoding ascii
      - run: scripts/ci-rust.sh
        shell: bash
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: scripts/linux-deps.sh
      # kanso-audio's libopus is built from the source the opus crate bundles,
      # with CMake (Linux has it from linux-deps.sh).
      - name: CMake (libopus)
        run: scripts/cmake-deps.sh
        # Windows' default shell is PowerShell, which can't run the script.
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --locked -- -D warnings
      # Everything but the app runs here too: the store, sync, server,
      # renderer, importer and updater, whose file, path and process code
      # differs per platform. The app's tests need macOS's text system.
      - name: Tests (all but the app)
        run: cargo test --workspace --locked --exclude kanso-app
        shell: bash
      # The PDF worker contains itself with Landlock and seccomp on Linux:
      # its tests start the real worker, which has to refuse to run where
      # that can't be applied (issue #43). Windows builds the worker above;
      # its AppContainer needs an installed folder, so its tests wait for a
      # runner that has one.
      - name: PDF worker (Linux)
        if: runner.os == 'Linux'
        run: |
          scripts/fetch-pdfium.sh
          scripts/check-pdfium-no-v8.sh vendor/pdfium
          cargo test --locked -p kanso-pdf --features render
        shell: bash

  # The core the mobile app shares (#48): the engine, store, renderer, shared
  # notes, importers, sync client and AI client have to build for iOS and
  # Android, with no window system, no desktop Keychain and no agent process
  # in their trees, and their tests run on the iOS Simulator. On a hosted
  # Mac, which has Xcode, the simulators and the Android NDK. The Android
  # tests run in mobile-core.yml, on a Linux runner that can run an emulator.
  # The C code in SQLite, ring, QuickJS and tree-sitter needs the NDK's clang
  # for each Android target, and rquickjs's bindings need libclang: both are
  # set up by scripts/mobile/env.sh. The rust-toolchain.toml doesn't list the
  # phones' targets: the desktop builds never need them.
  engine-mobile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The built-in themes: the kanso-themes repository.
          submodules: true
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: scripts/ci-rust.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      # `cargo check` for the five targets, the banned-dependency look
      # (gpui, objc, keyring, kanso-acp) and clippy for the phones' cfg-gated
      # code.
      - run: scripts/mobile-check.sh
      # The library and integration tests, in the first iPhone simulator.
      - run: scripts/mobile-test.sh ios-sim

  # The PDF worker's hardening (issue #43, step 9), on GitHub's own runners so
  # it also runs for a pull request from a fork: it builds only kanso-pdf
  # (no PDFium, no window) and runs nothing from the PR with a secret.
  # - The check that refuses a V8 build of PDFium is itself tested, against
  #   stand-ins and against the real V8 archive of the build Kanso pins, and
  #   run on the library Kanso would ship.
  # - A short fuzz run of the protocol decoder (cargo-fuzz, nightly), seeded
  #   with valid frames and the hostile-PDF corpus. The hostile PDFs go
  #   through the real worker in the `rust` and `portability` jobs above.
  pdf-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The built-in themes: the kanso-themes repository. kanso-engine's
          # build script reads themes/index.json, so a checkout without it
          # fails before the first fuzz frame.
          submodules: true
      # The PDFium binary and the `pdfium-render` wrapper are a pair: the
      # wrapper's `pdfium_<build>` feature is the pinned build, so the weekly
      # bump (.github/workflows/pdfium-bump.yml) cannot ship one without the
      # other (issue #43, step 15).
      - name: PDFium binary and wrapper are a pair
        run: |
          scripts/test-check-pdfium-pair.sh
          scripts/check-pdfium-pair.sh
      - name: PDFium is not a V8 build
        run: |
          scripts/test-check-pdfium.sh --real-v8
          scripts/fetch-pdfium.sh linux-x64
          scripts/check-pdfium-no-v8.sh vendor/pdfium
      - run: scripts/ci-rust.sh
      # Cargo refuses a `pdfium_<build>` feature the pinned wrapper doesn't have.
      - name: pdfium-render has the feature
        run: cargo tree --locked -p kanso-pdf --features render -e features -i pdfium-render >/dev/null
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            crates/kanso-pdf/fuzz -> target
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz the worker protocol (60 s)
        run: scripts/pdf-fuzz.sh 60
      # A crash is kept for whoever reads the failure.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: pdf-fuzz-crashes
          path: crates/kanso-pdf/fuzz/artifacts
          if-no-files-found: ignore

  worker:
    # On a Mac: the property tests time out on the small Linux containers.
    runs-on: macos-15
    defaults:
      run:
        working-directory: cloud
    env:
      # fast-check reads its seed in vitest.config.ts.
      FAST_CHECK_SEED: "20261017"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  # kansoapp.app: types, tests with their coverage floor, and a production
  # build. Nothing here needs Cloudflare credentials; deploying is by hand.
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    env:
      # fast-check reads its seed in src/test/setup.ts.
      FAST_CHECK_SEED: "20261017"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  # The Worker under wrangler dev (Miniflare, no Cloudflare credentials) and
  # the Rust client against it: cloud/scripts/e2e-local.sh.
  # The Mac as well: it builds kanso-sync, whose Linux keyring needs dbus.
  # Jobs share that Mac, so the script takes a free port the OS picks rather
  # than a fixed KANSO_E2E_PORT.
  e2e:
    runs-on: macos-15
    needs: [rust, worker]
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The built-in themes: the kanso-themes repository.
          submodules: true
      - run: scripts/ci-rust.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
        working-directory: cloud
      - run: cloud/scripts/e2e-local.sh
