name: Release

# A `v*` tag builds every platform and publishes a GitHub Release with the
# downloads, the update archives, the signed update feed (latest.json and
# latest.json.sig), the .debs with the apt repository's signed index
# (docs/APT.md) and SHA256SUMS, once every check passes; everyone's Kanso
# then sees the update. If any check fails, nothing is published.
# Run by hand (workflow_dispatch), it builds the same downloads as artifacts
# only, without a feed. docs/RELEASING.md has the whole flow.
#
# The update signing key is the most sensitive thing here: whoever holds it
# ships code to everyone's Kanso. It is only ever in the `feed` job, which
# runs on a tag, in the `release` environment, with a read-only token and
# no third-party actions; the key reaches one step, which runs a binary
# built in an earlier step. Every action is pinned to a commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The Developer ID certificate and the notarization key are secrets of
    # the `release` environment (v* tags only), so only a tagged macOS build
    # sees them; every other build stays ad hoc.
    environment: ${{ (matrix.name == 'macos-arm64' && github.ref_type == 'tag') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `pdfium` is the scripts/fetch-pdfium.sh platform whose library
          # the leg packages: each architecture ships its own.
          - name: macos-arm64
            os: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            pdfium: mac-arm64
          - name: windows-x64
            os: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
            pdfium: win-x64
          # Every job runs on the owner's self-hosted runners. The Linux
          # runners' glibc sets the oldest distribution the builds run on.
          - name: linux-x64
            os: [self-hosted, Linux, X64]
            target: x86_64-unknown-linux-gnu
            pdfium: linux-x64
          - name: linux-arm64
            os: [self-hosted, Linux, ARM64]
            target: aarch64-unknown-linux-gnu
            pdfium: linux-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The built-in themes: the kanso-themes repository.
          submodules: true

      # On the self-hosted Windows runner, plain `bash` is WSL's launcher in
      # WindowsApps, which can't run the step scripts; put Git Bash first.
      # Git for Windows may be installed for every user (Program Files) or
      # only the runner's (AppData\Local\Programs), so look where git is too.
      - name: Git Bash first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Git\bin'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Git\bin')
          )
          $gitExe = (Get-Command git -ErrorAction SilentlyContinue).Source
          if ($gitExe) { $candidates += Join-Path (Split-Path (Split-Path $gitExe)) 'bin' }
          $git = $candidates | Where-Object { Test-Path (Join-Path $_ 'bash.exe') } | Select-Object -First 1
          if (-not $git) {
            Write-Output "::error::Git for Windows' bash.exe isn't in any of: $($candidates -join ', '). The build steps need it."
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $git -Encoding ascii

      - name: Version
        id: version
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            if [ "$version" != "$crate_version" ]; then
              echo "::error::The tag says $version but Cargo.toml says $crate_version; bump [workspace.package] version first."
              exit 1
            fi
          else
            version="$crate_version-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "stem=Kanso-$version-${{ matrix.name }}" >>"$GITHUB_OUTPUT"

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Rust
        run: scripts/ci-rust.sh

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: scripts/linux-deps.sh

      # kanso-audio's libopus is built from the source the opus crate bundles,
      # with CMake (Linux has it from linux-deps.sh).
      - name: CMake (libopus)
        run: scripts/cmake-deps.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      # The PDFium library PDFs are drawn with: a pinned, checksummed,
      # non-V8 build (scripts/fetch-pdfium.sh). macOS fetches it when it
      # bundles.
      - name: PDFium
        if: runner.os != 'macOS'
        shell: bash
        env:
          PDFIUM_PLATFORM: ${{ matrix.pdfium }}
        run: scripts/fetch-pdfium.sh "$PDFIUM_PLATFORM"

      - name: Build
        run: cargo build --release --locked -p kanso-app -p kanso-plugin-host -p kanso-pdf --features kanso-pdf/render

      # Developer ID signing and notarization when every Apple secret is set;
      # otherwise an ad hoc signature, as before. The secrets reach the shell
      # as variables, never the command line.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Optional: the Developer ID provisioning profile that authorizes
          # Associated Domains for native passkeys (docs/RELEASING.md).
          MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          STEM: ${{ steps.version.outputs.stem }}
        run: |
          stem=$STEM
          app=target/release/Kanso.app
          signing=0
          if [ -n "$MACOS_CERT_P12_BASE64" ] && [ -n "$MACOS_CERT_PASSWORD" ] &&
            [ -n "$APPLE_API_KEY_P8_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            signing=1
          fi

          if [ "$signing" = 1 ]; then
            # A throwaway keychain with the Developer ID certificate.
            keychain="$RUNNER_TEMP/kanso-signing.keychain-db"
            keychain_password=$(openssl rand -hex 24)
            echo "$MACOS_CERT_P12_BASE64" | base64 --decode >"$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            identity=$(security find-identity -v -p codesigning "$keychain" |
              sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
            [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in MACOS_CERT_P12_BASE64"; exit 1; }
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode >"$RUNNER_TEMP/AuthKey.p8"
            export KANSO_SIGN_IDENTITY="$identity"
            echo "Signing with $identity, hardened runtime, and notarizing."
            if [ -n "$MACOS_PROVISION_PROFILE_BASE64" ]; then
              echo "$MACOS_PROVISION_PROFILE_BASE64" | base64 --decode >"$RUNNER_TEMP/Kanso.provisionprofile"
              export KANSO_PROVISION_PROFILE="$RUNNER_TEMP/Kanso.provisionprofile"
              echo "Embedding the provisioning profile for native passkeys."
            else
              echo "::notice::No MACOS_PROVISION_PROFILE_BASE64: the app is built without Associated Domains, so native passkeys are unavailable."
            fi
          else
            echo "::notice::No Apple signing secrets: the app is signed ad hoc and not notarized."
          fi

          notarize() {
            xcrun notarytool submit "$1" --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          }

          sh scripts/test-macos-profile.sh
          scripts/bundle-macos.sh
          if [ "$signing" = 1 ]; then
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Kanso-notarize.zip"
            notarize "$RUNNER_TEMP/Kanso-notarize.zip"
            xcrun stapler staple "$app"
          fi
          codesign --verify --deep --strict "$app"
          # Without it the hardened runtime keeps voice input from the
          # microphone, and macOS never asks.
          codesign -d --entitlements - --xml "$app" 2>/dev/null |
            grep -q com.apple.security.device.audio-input ||
            { echo "::error::Kanso.app is missing the microphone entitlement"; exit 1; }
          # With the profile, passkeys need both the embedded profile and the
          # domain in the signature; one without the other won't launch.
          if [ -n "${KANSO_PROVISION_PROFILE:-}" ]; then
            [ -f "$app/Contents/embedded.provisionprofile" ] ||
              { echo "::error::Kanso.app is missing embedded.provisionprofile"; exit 1; }
            codesign -d --entitlements - --xml "$app" 2>/dev/null |
              grep -q webcredentials:sync.kansoapp.app ||
              { echo "::error::Kanso.app is missing the Associated Domains entitlement"; exit 1; }
          fi
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist" >/dev/null
          # Launch the signed app once: AMFI kills a binary whose restricted
          # entitlements its profile or certificate doesn't cover, and
          # nothing above would notice.
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          "$exe" --help >/dev/null ||
            { echo "::error::The signed Kanso.app didn't launch (exit $?)"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag publishes itself, so it must be the notarized build
            # Gatekeeper accepts, never an ad hoc one.
            [ "$signing" = 1 ] || { echo "::error::A release needs the Developer ID and notarization secrets"; exit 1; }
            spctl --assess --type execute -vv "$app"
          fi

          mkdir -p dist dmg
          # The update archive: the .app alone, with no AppleDouble files
          # or extended attributes, which the updater would refuse or which
          # would break the signature.
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -C target/release \
            -czf "dist/$stem.app.tar.gz" Kanso.app
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" while Spotlight or
          # XProtect looks at the new volume; a short wait and retry clears it.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Kanso -srcfolder dmg -fs HFS+ -format UDZO -ov "dist/$stem.dmg" && break
            [ "$attempt" -lt 5 ] || exit 1
            echo "hdiutil failed (attempt $attempt); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          if [ "$signing" = 1 ]; then
            codesign --force --timestamp --sign "$KANSO_SIGN_IDENTITY" "dist/$stem.dmg"
            notarize "dist/$stem.dmg"
            xcrun stapler staple "dist/$stem.dmg"
            security delete-keychain "$keychain"
            rm -f "$RUNNER_TEMP/AuthKey.p8"
          fi

      # What goes in the archive is the PDFium build without V8, whatever was
      # fetched or cached: PDF JavaScript can't run in it (issue #43).
      - name: PDFium is not a V8 build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/check-pdfium-no-v8.sh vendor/pdfium/win-x64

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          STEM: ${{ steps.version.outputs.stem }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # Kanso, its helpers and the PDFium library sit together; PDFium's
          # licences ride along.
          $stage = Join-Path $env:RUNNER_TEMP 'zip'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/kanso.exe, target/release/kanso-plugin-host.exe, `
            target/release/kanso-pdf-worker.exe, vendor/pdfium/win-x64/bin/pdfium.dll $stage
          Copy-Item vendor/pdfium/win-x64/licenses -Destination (Join-Path $stage 'pdfium-licenses') -Recurse
          Copy-Item vendor/pdfium/win-x64/LICENSE -Destination (Join-Path $stage 'pdfium-licenses/LICENSE')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist/$env:STEM.zip"

      # A per-user installer beside the zip (packaging/windows/kanso.iss).
      # Inno Setup is fetched at a pinned version and checked against its
      # published SHA-256 before it runs.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          STEM: ${{ steps.version.outputs.stem }}
          VERSION: ${{ steps.version.outputs.version }}
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $inno = Join-Path $env:RUNNER_TEMP 'inno'
          Invoke-WebRequest -UseBasicParsing -Uri $env:INNO_URL -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup's SHA-256 is $hash, not $env:INNO_SHA256" }
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$inno")
          if ($p.ExitCode -ne 0) { throw "Inno Setup didn't install (exit $($p.ExitCode))" }
          $exe = (Resolve-Path target/release/kanso.exe).Path
          $dist = (Resolve-Path dist).Path
          $hostExe = (Resolve-Path target/release/kanso-plugin-host.exe).Path
          $pdfWorker = (Resolve-Path target/release/kanso-pdf-worker.exe).Path
          $pdfium = (Resolve-Path vendor/pdfium/win-x64).Path
          & (Join-Path $inno 'ISCC.exe') "/DAppVersion=$env:VERSION" "/DSourceExe=$exe" "/DSourceHostExe=$hostExe" `
            "/DSourcePdfWorker=$pdfWorker" "/DSourcePdfium=$pdfium" "/DOutputDir=$dist" "/DOutputBase=$env:STEM-setup" packaging/windows/kanso.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          STEM: ${{ steps.version.outputs.stem }}
          PDFIUM_PLATFORM: ${{ matrix.pdfium }}
        run: |
          stem=$STEM
          pdfium=vendor/pdfium/$PDFIUM_PLATFORM
          mkdir -p "dist" "$stem"
          install -m 755 target/release/kanso "$stem/kanso"
          strip "$stem/kanso"
          install -m 755 target/release/kanso-plugin-host "$stem/kanso-plugin-host"
          strip "$stem/kanso-plugin-host"
          install -m 755 target/release/kanso-pdf-worker "$stem/kanso-pdf-worker"
          strip "$stem/kanso-pdf-worker"
          install -m 755 "$pdfium/lib/libpdfium.so" "$stem/libpdfium.so"
          # The library in the archive is the PDFium build without V8, and
          # for the same machine as the worker beside it.
          scripts/check-pdfium-no-v8.sh "$stem/libpdfium.so"
          scripts/check-pdfium-arch.sh "$stem/libpdfium.so" "$stem/kanso-pdf-worker"
          mkdir -p "$stem/pdfium-licenses"
          cp -R "$pdfium/licenses/." "$stem/pdfium-licenses/"
          cp "$pdfium/LICENSE" "$stem/pdfium-licenses/LICENSE"
          install -m 644 assets/linux/kanso.desktop "$stem/kanso.desktop"
          install -m 644 assets/icon/kanso.png "$stem/kanso.png"
          install -m 755 assets/linux/install.sh "$stem/install.sh"
          tar -czf "dist/$stem.tar.gz" "$stem"

      # The .deb for apt (docs/APT.md), from the same binaries. It never
      # stops a release: without it the tarball ships as before, and the apt
      # job finds no .deb to index.
      - name: Package (Debian)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PDFIUM_PLATFORM: ${{ matrix.pdfium }}
        run: |
          if [ "$(cargo deb --version 2>/dev/null)" != "cargo-deb 3.8.0" ]; then
            cargo install cargo-deb --version 3.8.0 --locked
          fi
          scripts/deb-build.sh "$VERSION" dist

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.version.outputs.stem }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  # Checksums for a run by hand, which has no feed and no release.
  checksums:
    name: Checksums
    if: github.ref_type != 'tag'
    needs: build
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  # The signed feed. Nothing here can write to the repository, and nothing
  # but GitHub's own actions and this repository's code runs: the signing
  # key is in reach of as little as possible. Keep KANSO_UPDATE_SIGNING_KEY
  # as a secret of the `release` environment, limited to `v*` tags
  # (docs/RELEASING.md › One-time setup).
  feed:
    name: Signed update feed
    if: github.ref_type == 'tag'
    needs: [build, apt]
    runs-on: [self-hosted, Linux]
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      # The download has finished without every file before (a missing
      # Windows zip, a truncated dmg whose SHA256SUMS then came out wrong):
      # check each file is there and whole, download again if not, and fail
      # here rather than sign a feed over a short set.
      - name: Verify the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-artifacts.sh dist "${GITHUB_REF_NAME#v}" '^(Kanso-.*|apt-metadata)$'

      - name: Rust
        run: scripts/ci-rust.sh

      # Built here, without the key: build scripts and proc macros never
      # see it.
      - name: Build kanso-release
        run: cargo build --release --locked -p kanso-update --bin kanso-release

      # The release's section of CHANGELOG.md, which scripts/release.sh
      # wrote with git-cliff: the release page and latest.json say the same.
      # A tag without one fails here rather than run git-cliff in this job.
      - name: Release notes
        run: |
          mkdir -p notes
          target/release/kanso-release notes --changelog CHANGELOG.md \
            --version "${GITHUB_REF_NAME#v}" --out notes/notes.md

      - name: Update feed
        run: |
          target/release/kanso-release feed --version "${GITHUB_REF_NAME#v}" \
            --notes notes/notes.md --dist dist \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out dist/latest.json

      # The one step with the key. Without it the release stops here, since
      # an unsigned feed would never update anyone.
      - name: Sign the feed
        env:
          KANSO_UPDATE_SIGNING_KEY: ${{ secrets.KANSO_UPDATE_SIGNING_KEY }}
        run: target/release/kanso-release sign --feed dist/latest.json

      - name: Verify the feed
        run: target/release/kanso-release verify --feed dist/latest.json

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-feed
          path: |
            dist/latest.json
            dist/latest.json.sig
            dist/SHA256SUMS
            notes/notes.md
          if-no-files-found: error

  # The apt repository's signed index (docs/APT.md): Packages, Release,
  # InRelease and Release.gpg as release assets, which kansoapp.app/apt
  # redirects to. A job of its own, so the apt key and the update key are
  # never in reach of the same steps; in the `release` environment, so only
  # a v* tag reaches the key. Until scripts/apt-setup.sh has stored the key
  # it publishes nothing and says so, and the release goes on as before.
  apt:
    name: apt repository
    if: github.ref_type == 'tag'
    needs: build
    runs-on: [self-hosted, Linux]
    environment: release
    permissions:
      contents: read
    outputs:
      published: ${{ steps.index.outputs.published }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true
          pattern: Kanso-*

      # A runner that can't get the tools skips the index, with a warning;
      # the release goes on without it, as it does without the key.
      - name: apt tools
        id: tools
        continue-on-error: true
        run: scripts/apt-tools.sh

      - name: Signed index
        id: index
        if: steps.tools.outcome == 'success'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: scripts/apt-release.sh dist "$GITHUB_REF_NAME" apt

      - name: Forget the key
        if: always()
        run: |
          GNUPGHOME="$RUNNER_TEMP/kanso-apt-gnupg" gpgconf --kill gpg-agent 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/kanso-apt-gnupg"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.index.outputs.published == 'true'
        with:
          name: apt-metadata
          path: apt/*
          if-no-files-found: error

  # Publishes the release once everything above passed: each platform
  # built (macOS signed, notarized and accepted by Gatekeeper), the update
  # feed signed and verified against the app's trusted key, and every file
  # matching SHA256SUMS. It goes up as a draft first and is published only
  # once every file is uploaded, so nobody sees a half-uploaded release.
  # The only job that can write, and it runs no code from the repository.
  publish:
    name: Publish release
    needs: [build, apt, feed]
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true
          pattern: Kanso-*

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-feed
          path: feed

      # The feed job's SHA256SUMS covers these too: it downloads every
      # artifact.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.apt.outputs.published == 'true'
        with:
          name: apt-metadata
          path: dist

      # This job runs no code from the repository, so the check is inline: a
      # download that finished without every file, or with an empty one,
      # fails here by name. A truncated file is caught by SHA256SUMS below.
      - name: Check every platform's files are there
        run: |
          v=${GITHUB_REF_NAME#v}
          missing=0
          for f in "Kanso-$v-macos-arm64.dmg" "Kanso-$v-macos-arm64.app.tar.gz" \
            "Kanso-$v-windows-x64.zip" "Kanso-$v-linux-x64.tar.gz" "Kanso-$v-linux-arm64.tar.gz"; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::dist/$f is missing or empty after the download"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

      - name: Check every file against SHA256SUMS
        run: |
          cp feed/dist/latest.json feed/dist/latest.json.sig feed/dist/SHA256SUMS dist/
          cd dist && sha256sum --check --strict SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --notes-file feed/notes/notes.md --title "Kanso ${GITHUB_REF_NAME#v}"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
