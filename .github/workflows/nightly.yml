name: Nightly

# Builds Kanso Nightly from master once a day, but only when CI is green and
# master has moved since the last nightly. The version is the Cargo version
# with a `-nightly.<YYYYMMDDHHMM>` (UTC) prerelease suffix, compiled in through
# KANSO_NIGHTLY_VERSION, and the four update archives plus the signed
# latest.json are published to the moving `nightly` prerelease. Kanso Nightly
# follows that feed; Kanso itself never sees it.
#
# The signing key is a secret of the `nightly` environment and is only in
# reach of the feed job. The public half is a repository variable,
# NIGHTLY_UPDATE_PUBLIC_KEY, which the feed is verified against before it is
# published. docs/RELEASING.md has the one-time setup.
on:
  schedule:
    # 02:00 UTC daily (owner decision, issue #328).
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.gate.outputs.build }}
      version: ${{ steps.gate.outputs.version }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
          persist-credentials: false

      - name: Decide whether to build
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # One number, UTC YYYYMMDDHHMM: it always increases and never starts with
          # a zero (semver forbids that in a numeric identifier, as a commit
          # hash could). The commit goes in the notes, not the version.
          version="$crate_version-nightly.$(date -u +%Y%m%d%H%M)"
          build=0
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            build=1
            echo "Manual run: building $version."
          else
            # The latest CI run on master must have passed. A docs-only
            # commit has no run of its own; the last green run still covers
            # the code, which is what the nightly builds.
            ci=$(gh run list --workflow=ci.yml --branch=master --limit=1 \
              --json conclusion,status --jq '.[0] // empty')
            conclusion=$(printf '%s' "$ci" | jq -r '.conclusion // empty')
            last=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" \
              --jq '.object.sha' 2>/dev/null || true)
            if [ "$conclusion" != success ]; then
              echo "Skipping: master's latest CI run is ${conclusion:-missing}, not success."
            elif [ "$last" = "$sha" ]; then
              echo "Skipping: nightly already points at $sha."
            else
              build=1
              echo "Building $version from $sha (CI passed)."
            fi
          fi
          {
            echo "build=$build"
            echo "version=$version"
            echo "sha=$sha"
          } >>"$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.build == '1'
    runs-on: ${{ matrix.os }}
    # The Developer ID certificate and notarization key are secrets of the
    # `nightly` environment. Every macOS nightly must be signed and
    # notarized: an ad hoc build is not installable on anyone else's Mac.
    environment: ${{ matrix.name == 'macos-arm64' && 'nightly' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            pdfium: mac-arm64
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            pdfium: win-x64
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pdfium: linux-x64
            onnxruntime: linux-x64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            pdfium: linux-arm64
            onnxruntime: linux-arm64
    defaults:
      run:
        shell: bash
    env:
      KANSO_NIGHTLY_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Exactly the commit the plan chose, not whatever master is now.
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      - name: Git Bash first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Git\bin'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Git\bin')
          )
          $gitExe = (Get-Command git -ErrorAction SilentlyContinue).Source
          if ($gitExe) { $candidates += Join-Path (Split-Path (Split-Path $gitExe)) 'bin' }
          $git = $candidates | Where-Object { Test-Path (Join-Path $_ 'bash.exe') } | Select-Object -First 1
          if (-not $git) {
            Write-Output "::error::Git for Windows' bash.exe isn't in any of: $($candidates -join ', '). The build steps need it."
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $git -Encoding ascii

      - name: Strawberry Perl for OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $candidates = @($env:OPENSSL_SRC_PERL, 'C:\Strawberry\perl\bin\perl.exe') | Where-Object { $_ }
          $perl = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $perl) {
            choco install strawberryperl --no-progress -y
            $perl = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $perl) {
            Write-Output "::error::Strawberry Perl isn't installed and could not be: the vendored OpenSSL build needs a Windows Perl. Install it from https://strawberryperl.com."
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_SRC_PERL=$perl" -Encoding ascii
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $perl) -Encoding ascii

      - name: Version
        id: version
        run: |
          version=$KANSO_NIGHTLY_VERSION
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "stem=Kanso-$version-${{ matrix.name }}" >>"$GITHUB_OUTPUT"

      - name: Rust
        run: scripts/ci-rust.sh

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: scripts/linux-deps.sh

      - name: CMake (libopus)
        run: scripts/cmake-deps.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: nightly-${{ matrix.target }}

      - name: PDFium
        if: runner.os != 'macOS'
        shell: bash
        env:
          PDFIUM_PLATFORM: ${{ matrix.pdfium }}
        run: scripts/fetch-pdfium.sh "$PDFIUM_PLATFORM"

      - name: ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        env:
          ORT_PLATFORM: ${{ matrix.onnxruntime }}
        run: |
          scripts/fetch-onnxruntime.sh "$ORT_PLATFORM"
          echo "ORT_LIB_LOCATION=$PWD/vendor/onnxruntime/$ORT_PLATFORM/lib" >>"$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >>"$GITHUB_ENV"

      # macOS is built by scripts/bundle-macos.sh --nightly below, into its
      # own target folder, so a build here would be thrown away.
      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p kanso-app -p kanso-plugin-host -p kanso-pdf --features kanso-app/nightly-flavour,kanso-pdf/render

      # Developer ID signing and notarization. Unlike a tagged release this
      # never falls back to ad hoc: a nightly nobody can open is not useful.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          STEM: ${{ steps.version.outputs.stem }}
        run: |
          stem=$STEM
          app="target/kanso-nightly/release/Kanso Nightly.app"
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$MACOS_CERT_PASSWORD" ] ||
            [ -z "$APPLE_API_KEY_P8_BASE64" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::Nightly macOS builds need the Developer ID and notarization secrets in the nightly environment."
            exit 1
          fi

          keychain="$RUNNER_TEMP/kanso-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # paths are the shell's own, already quoted by it
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in MACOS_CERT_P12_BASE64"; exit 1; }
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode >"$RUNNER_TEMP/AuthKey.p8"
          export KANSO_SIGN_IDENTITY="$identity"
          if [ -n "$MACOS_PROVISION_PROFILE_BASE64" ]; then
            echo "$MACOS_PROVISION_PROFILE_BASE64" | base64 --decode >"$RUNNER_TEMP/Kanso.provisionprofile"
            export KANSO_PROVISION_PROFILE="$RUNNER_TEMP/Kanso.provisionprofile"
          else
            echo "::notice::No MACOS_PROVISION_PROFILE_BASE64: native passkeys are unavailable."
          fi

          notarize() {
            xcrun notarytool submit "$1" --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          }

          scripts/bundle-macos.sh --nightly
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Kanso-Nightly-notarize.zip"
          notarize "$RUNNER_TEMP/Kanso-Nightly-notarize.zip"
          for try in 1 2 3 4 5; do
            xcrun stapler staple "$app" && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 20))
          done
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$app/Contents/Info.plist" >/dev/null
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          "$exe" --help >/dev/null || { echo "::error::The signed Kanso Nightly didn't launch"; exit 1; }
          spctl --assess --type execute -vv "$app"

          mkdir -p dist dmg
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -C target/kanso-nightly/release \
            -czf "dist/$stem.app.tar.gz" "Kanso Nightly.app"
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "Kanso Nightly" -srcfolder dmg -fs HFS+ -format UDZO -ov "dist/$stem.dmg" && break
            [ "$attempt" -lt 5 ] || exit 1
            echo "hdiutil failed (attempt $attempt); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          codesign --force --timestamp --sign "$KANSO_SIGN_IDENTITY" "dist/$stem.dmg"
          notarize "dist/$stem.dmg"
          for try in 1 2 3 4 5; do
            xcrun stapler staple "dist/$stem.dmg" && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 20))
          done
          security delete-keychain "$keychain"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: PDFium is not a V8 build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/check-pdfium-no-v8.sh vendor/pdfium/win-x64

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          STEM: ${{ steps.version.outputs.stem }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'zip'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/kanso.exe, target/release/kanso-plugin-host.exe, `
            target/release/kanso-pdf-worker.exe, vendor/pdfium/win-x64/bin/pdfium.dll $stage
          Copy-Item vendor/pdfium/win-x64/licenses -Destination (Join-Path $stage 'pdfium-licenses') -Recurse
          Copy-Item vendor/pdfium/win-x64/LICENSE -Destination (Join-Path $stage 'pdfium-licenses/LICENSE')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist/$env:STEM.zip"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          STEM: ${{ steps.version.outputs.stem }}
          VERSION: ${{ steps.version.outputs.version }}
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $inno = Join-Path $env:RUNNER_TEMP 'inno'
          Invoke-WebRequest -UseBasicParsing -Uri $env:INNO_URL -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup's SHA-256 is $hash, not $env:INNO_SHA256" }
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$inno")
          if ($p.ExitCode -ne 0) { throw "Inno Setup didn't install (exit $($p.ExitCode))" }
          $exe = (Resolve-Path target/release/kanso.exe).Path
          $dist = (Resolve-Path dist).Path
          $hostExe = (Resolve-Path target/release/kanso-plugin-host.exe).Path
          $pdfWorker = (Resolve-Path target/release/kanso-pdf-worker.exe).Path
          $pdfium = (Resolve-Path vendor/pdfium/win-x64).Path
          & (Join-Path $inno 'ISCC.exe') "/DNightly=1" "/DAppVersion=$env:VERSION" "/DSourceExe=$exe" `
            "/DSourceHostExe=$hostExe" "/DSourcePdfWorker=$pdfWorker" "/DSourcePdfium=$pdfium" `
            "/DOutputDir=$dist" "/DOutputBase=$env:STEM-setup" packaging/windows/kanso.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          STEM: ${{ steps.version.outputs.stem }}
          PDFIUM_PLATFORM: ${{ matrix.pdfium }}
          ORT_PLATFORM: ${{ matrix.onnxruntime }}
        run: |
          stem=$STEM
          pdfium=vendor/pdfium/$PDFIUM_PLATFORM
          mkdir -p dist "$stem"
          install -m 755 target/release/kanso "$stem/kanso"
          strip "$stem/kanso"
          xkbcommon_x11=$(dpkg-query -L libxkbcommon-x11-0 |
            awk '/\/libxkbcommon-x11\.so\.0(\.0\.0)?$/ { print; exit }')
          xcb_xkb=$(dpkg-query -L libxcb-xkb1 |
            awk '/\/libxcb-xkb\.so\.1(\.0\.0)?$/ { print; exit }')
          for library in "$xkbcommon_x11" "$xcb_xkb"; do
            if [ -z "$library" ] || [ ! -e "$library" ]; then
              echo "::error::The XKB runtime library is missing from the runner; install libxkbcommon-x11-dev and libxcb-xkb1."
              exit 1
            fi
          done
          install -m 755 "$(readlink -f "$xkbcommon_x11")" "$stem/libxkbcommon-x11.so.0"
          install -m 755 "$(readlink -f "$xcb_xkb")" "$stem/libxcb-xkb.so.1"
          # shellcheck disable=SC2016 # $ORIGIN is the literal loader token.
          patchelf --set-rpath '$ORIGIN' "$stem/libxkbcommon-x11.so.0"
          mkdir -p "$stem/xkb-licenses"
          cp /usr/share/doc/libxkbcommon-x11-0/copyright "$stem/xkb-licenses/libxkbcommon-x11.copyright"
          cp /usr/share/doc/libxcb-xkb1/copyright "$stem/xkb-licenses/libxcb-xkb.copyright"
          scripts/check-linux-xkb.sh "$stem/kanso" "$stem/libxkbcommon-x11.so.0" "$stem/libxcb-xkb.so.1"
          ort=vendor/onnxruntime/$ORT_PLATFORM
          install -m 755 "$ort/lib/libonnxruntime.so.1" "$stem/libonnxruntime.so.1"
          mkdir -p "$stem/onnxruntime-licenses"
          cp "$ort/LICENSE" "$ort/ThirdPartyNotices.txt" "$stem/onnxruntime-licenses/"
          install -m 755 target/release/kanso-plugin-host "$stem/kanso-plugin-host"
          strip "$stem/kanso-plugin-host"
          install -m 755 target/release/kanso-pdf-worker "$stem/kanso-pdf-worker"
          strip "$stem/kanso-pdf-worker"
          install -m 755 "$pdfium/lib/libpdfium.so" "$stem/libpdfium.so"
          scripts/check-pdfium-no-v8.sh "$stem/libpdfium.so"
          scripts/check-pdfium-arch.sh "$stem/libpdfium.so" "$stem/kanso-pdf-worker"
          mkdir -p "$stem/pdfium-licenses"
          cp -R "$pdfium/licenses/." "$stem/pdfium-licenses/"
          cp "$pdfium/LICENSE" "$stem/pdfium-licenses/LICENSE"
          install -m 644 assets/linux/kanso-nightly.desktop "$stem/kanso-nightly.desktop"
          install -m 644 assets/icon/kanso-nightly.png "$stem/kanso-nightly.png"
          # The archive is Kanso Nightly, so its install.sh must not install
          # the nightly binary over Kanso when run without a flag.
          sed 's/^nightly=0$/nightly=1/' assets/linux/install.sh >"$stem/install.sh"
          chmod 755 "$stem/install.sh"
          sh -n "$stem/install.sh"
          scripts/check-linux-portable.sh "$stem/kanso" "$stem/kanso-plugin-host" \
            "$stem/kanso-pdf-worker" "$stem/libonnxruntime.so.1" "$stem/libxkbcommon-x11.so.0" "$stem/libxcb-xkb.so.1"
          tar -czf "dist/$stem.tar.gz" "$stem"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.version.outputs.stem }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  feed:
    name: Signed nightly feed
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment: nightly
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true
          pattern: Kanso-*

      - name: Check the archives
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          missing=0
          for name in \
            "Kanso-$VERSION-macos-arm64.app.tar.gz" \
            "Kanso-$VERSION-macos-arm64.dmg" \
            "Kanso-$VERSION-windows-x64.zip" \
            "Kanso-$VERSION-windows-x64-setup.exe" \
            "Kanso-$VERSION-linux-x64.tar.gz" \
            "Kanso-$VERSION-linux-arm64.tar.gz"; do
            if [ ! -s "dist/$name" ]; then
              echo "::error::Missing or empty: $name"
              missing=1
            fi
          done
          [ "$missing" = 0 ]

      - name: Rust
        run: scripts/ci-rust.sh

      - name: Build kanso-release
        run: cargo build --release --locked -p kanso-update --bin kanso-release

      - name: Nightly notes
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          mkdir -p notes
          # Merged PRs since the last nightly tag, or since the last release
          # tag on the first run. Empty range → all subjects on master.
          if last=$(git rev-parse -q --verify "refs/tags/nightly^{commit}" 2>/dev/null); then
            range="$last..HEAD"
          elif last=$(git describe --tags --abbrev=0 2>/dev/null); then
            range="$last..HEAD"
          else
            range="HEAD"
          fi
          target/release/kanso-release notes --commits "$range" --out notes/body.md
          # The commit is named here, not in the version.
          {
            echo "Built from commit \`${SHA::7}\`."
            echo
            cat notes/body.md
          } >notes/notes.md
          rm notes/body.md
          cat notes/notes.md

      - name: Update feed
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          target/release/kanso-release feed --version "$VERSION" \
            --notes notes/notes.md --dist dist \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/nightly" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/nightly" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out dist/latest.json

      - name: Sign the feed
        env:
          NIGHTLY_UPDATE_SIGNING_KEY: ${{ secrets.NIGHTLY_UPDATE_SIGNING_KEY }}
        run: |
          target/release/kanso-release sign --feed dist/latest.json \
            --key-env NIGHTLY_UPDATE_SIGNING_KEY --nightly

      - name: Verify the feed
        env:
          NIGHTLY_UPDATE_PUBLIC_KEY: ${{ vars.NIGHTLY_UPDATE_PUBLIC_KEY }}
        run: |
          if [ -z "$NIGHTLY_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::Set the NIGHTLY_UPDATE_PUBLIC_KEY repository variable to the public half of NIGHTLY_UPDATE_SIGNING_KEY."
            exit 1
          fi
          # Against the keys Kanso Nightly compiles in, and the variable.
          target/release/kanso-release verify --feed dist/latest.json --nightly \
            --key "$NIGHTLY_UPDATE_PUBLIC_KEY"

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nightly-feed
          path: |
            dist/latest.json
            dist/latest.json.sig
            dist/SHA256SUMS
            notes/notes.md
          if-no-files-found: error

  publish:
    name: Publish nightly
    needs: [plan, feed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true
          pattern: Kanso-*

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: feed
          name: nightly-feed

      - name: Gather the feed
        run: |
          cp feed/dist/latest.json feed/dist/latest.json.sig feed/dist/SHA256SUMS dist/
          cp feed/notes/notes.md notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh needs the repository named.
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Kanso Nightly" \
              --notes-file notes.md
            # Earlier nightlies' archives are named for their own version;
            # left alone they pile up every night. Keep only what this run
            # is about to upload (those are replaced in place).
            ls dist >current-assets.txt
            gh release view nightly --json assets --jq '.assets[].name' |
              while IFS= read -r name; do
                if ! grep -qxF -- "$name" current-assets.txt; then
                  echo "Deleting the old asset $name"
                  gh release delete-asset nightly "$name" --yes
                fi
              done
            gh release upload nightly dist/* --clobber
          else
            # The tag does not exist yet; creating the release at the commit
            # makes it.
            gh release create nightly dist/* --target "$SHA" --prerelease \
              --title "Kanso Nightly" --notes-file notes.md
          fi

          # Only now, with the release uploaded, move the moving tag. The
          # gate skips a commit the tag already points at, so a failed
          # publish above is retried by the next run.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
            -f sha="$SHA" -F force=true >/dev/null 2>&1 ||
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/nightly -f sha="$SHA" >/dev/null
          echo "Published $VERSION to https://github.com/$GITHUB_REPOSITORY/releases/tag/nightly"
