# git-cliff turns conventional commits into CHANGELOG.md and each release's
# notes (docs/RELEASING.md). The release page and the app's What's new show
# the same section; the app leaves out "Under the hood".
#
#   git cliff --unreleased --tag v0.2.0 --prepend CHANGELOG.md   (release.sh)
#   git cliff --latest --strip all                             (the workflow)

[changelog]
header = """
# Changelog

Every release of Kanso, newest first. Each entry links its commit, and each
heading compares the release with the one before.

"""
body = """
{%- set repo = "https://github.com/iamngoni/kanso" -%}
{#- Entries by anyone else end "by @login" (their GitHub no-reply address)
    or "by Name", so each feature is credited to whoever made it. -#}
{#- "Kanso Audit" is the owner's own coding agents committing for him. -#}
{#- The feedback build agent (.github/workflows/feedback-build.yml) commits as the
    Claude app; the person who reported the problem is credited by the trailer below. -#}
{%- set owners = ["@iamngoni", "Ngonidzashe Mangudya", "Kanso Audit", "@claude[bot]"] -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]\
({% if previous.version %}{{ repo }}/compare/{{ previous.version }}...{{ version }}\
{% else %}{{ repo }}/commits/{{ version }}{% endif %}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))\
{% if commit.breaking %} **(breaking)**{% endif %}\
{%- set email = commit.author.email | default(value="") -%}
{%- if email is ending_with("@users.noreply.github.com") -%}
{%- set login = email | split(pat="@") | first | split(pat="+") | last -%}
{#- The CI fixer's commits come from its app account; it's known as gridopsbot. -#}
{%- if login == "gridops-self-hosted[bot]" %}{% set login = "gridopsbot[bot]" %}{% endif -%}
{%- set who = "@" ~ login -%}
{%- else -%}
{%- set who = commit.author.name | default(value="") -%}
{%- endif -%}
{%- if who and who not in owners %} by {{ who }}{% endif %}
{#- A feedback fix is committed by the owner's agent, so the person who reported it is
    credited by the "Reported-by: Name (in app)" trailer: a plain name, never an @-mention
    (no GitHub ping, no account implied). A squash merge would drop the trailer.
    Anyone can write a trailer (an agent steered by an issue, any contributor's commit), so
    only a name the Worker would accept is printed (cloud/src/feedback.ts CREDIT_NAME:
    letters, digits, space, ". _ -", 1 to 39). Anything else (links, HTML, entities, "@",
    backticks) prints no credit at all. -#}
{%- for f in commit.footers -%}
{%- if f.token == "Reported-by" -%}
{%- set reporter = f.value | split(pat=" (") | first | trim -%}
{%- if reporter is matching("^[\\p{L}\\p{N} ._-]{1,39}$") %}, reported by {{ reporter }}{% endif -%}
{%- endif -%}
{%- endfor %}
{#- Last on the line: the update notice a breaking change ships. -#}
{%- if commit.breaking -%}
{%- for f in commit.footers -%}
{%- if f.token == "Notice" and f.value is matching("^[a-z0-9][a-z0-9.-]*$") %} (notice: {{ f.value }}){% endif -%}
{%- endfor -%}
{%- endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
# Merges and anything not conventional stay out of the notes.
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  # "(#12)" links the pull request.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/iamngoni/kanso/pull/${1}))" },
  # Release notes describe Kanso on its own terms (commit 76d2e0c's subject).
  { pattern = " that doesn't assume Inkdrop", replace = "" },
  # Commit 515dcf8's subject.
  { pattern = "Import from Inkdrop on Windows", replace = "Importing a library on Windows" },
  # Subjects of the first release's commits, in the CHANGELOG's own words.
  { pattern = "as a GPUI Inkdrop replacement", replace = "as a GPUI notes app" },
  { pattern = "Add Inkdrop importer", replace = "Add the PouchDB notes library importer" },
  { pattern = "decrypt Inkdrop's API credentials", replace = "decrypt the copied local API credentials" },
  { pattern = "Import from Inkdrop inside Kanso", replace = "Import a PouchDB notes library inside Kanso" },
  { pattern = "Add Inkdrop-compatible HTTP API", replace = "Add a local API compatible with popular local-server clients" },
  { pattern = "import Inkdrop and Zed themes", replace = "import theme packages and Zed themes" },
  { pattern = "Read Inkdrop's Keychain item", replace = "Read the Safe Storage Keychain item" },
  { pattern = "Verify Inkdrop files without", replace = "Verify imported files without" },
  # Commit e339fd3's subject: the domain is lower case, so the entry can't start with it.
  { pattern = "kansoapp\\.app, Kanso's website", replace = "Kanso's website, kansoapp.app" },
]
# The HTML comments order the groups and are stripped from the headings.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  # Formatting and lint-only commits change nothing anyone sees.
  { message = "^style(\\(.*\\))?: (?i)(rustfmt|format|clippy)", skip = true },
  # A breaking change gets its own group, listed first. Its commit carries a
  # "Notice: <id>" footer, printed as "(notice: <id>)" at the end of the entry
  # so that `kanso-release check-notices` can hold the release to it.
  { message = "^[a-z-]+(\\(.*\\))?!:", group = "<!-- 0 -->Breaking" },
  { footer = "^BREAKING[ -]CHANGE", group = "<!-- 0 -->Breaking" },
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^perf", group = "<!-- 1 -->Improved" },
  { message = "^style", group = "<!-- 1 -->Improved" },
  { message = "^ui", group = "<!-- 1 -->Improved" },
  { message = "^refactor\\(ui\\)", group = "<!-- 1 -->Improved" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^revert", group = "<!-- 2 -->Fixed" },
  { message = "^refactor", group = "<!-- 3 -->Under the hood" },
  { message = "^build", group = "<!-- 3 -->Under the hood" },
  { message = "^ci", group = "<!-- 3 -->Under the hood" },
  { message = "^chore", group = "<!-- 3 -->Under the hood" },
  { message = "^test", group = "<!-- 3 -->Under the hood" },
  { message = "^docs", group = "<!-- 3 -->Under the hood" },
  # Any other type (e.g. `site:`) is still a change worth listing.
  { message = "^[a-z-]+(\\(.*\\))?!?:", group = "<!-- 3 -->Under the hood" },
]
