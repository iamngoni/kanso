name: kanso_auth_session
description: The system's sign-in session (ASWebAuthenticationSession, Custom Tabs) for the Apple, Google and GitHub pages.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2
  flutter: 3.44.8

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: 29.0.11
  very_good_analysis: ^10.0.0

flutter:
  plugin:
    platforms:
      android:
        package: app.kanso.kanso_auth_session
        pluginClass: KansoAuthSessionPlugin
      ios:
        pluginClass: KansoAuthSessionPlugin
