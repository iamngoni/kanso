name: kanso_lock
description: Biometric unlock and the privacy cover for locked notes; the biometric secret goes to Rust, never through Dart.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2
  flutter: 3.44.8

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: 29.0.11
  very_good_analysis: ^10.0.0

flutter:
  plugin:
    platforms:
      android:
        package: app.kanso.kanso_lock
        pluginClass: KansoLockPlugin
      ios:
        pluginClass: KansoLockPlugin
