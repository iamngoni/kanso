[package]
name = "kanso-sync"
description = "Kanso's sync client: accounts with end-to-end encryption, and the sync engine that pulls remote changes, pushes local ones and moves attachment bytes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kanso-sync"
path = "src/bin/kanso-sync.rs"
# It reads the library's secrets from the system's store, or from
# `secrets.json` when the library's config says `"secretStore": "file"`.
required-features = ["system-keychain", "file-secrets"]

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
# Device approval's ephemeral X25519 exchange (docs/ACCOUNTS.md › Unlocking a new device).
curve25519-dalek.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
kanso-core.workspace = true
kanso-store.workspace = true
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true
# The account event socket (events.rs) and shared notes' live room (kanso-collab): a
# WebSocket over rustls (ring), trusting what kanso-tls says (the web's roots on a
# computer, the phone's store on iOS and Android).
kanso-tls = { workspace = true, features = ["ureq"] }
rustls.workspace = true
tungstenite.workspace = true
# WebAuthn signature checks (ES256, EdDSA, RS256): MemoryServer's relying party
# and the Linux security-key registration check. Already built for rustls.
ring = "0.17"
# Blocking HTTP with rustls: the GPUI app has no async runtime.
ureq = "3.4"
url = "2.5"

# The system's secret store for sessions, data keys, recovery keys and pending
# logouts: the Keychain on macOS, the Credential Manager on Windows, and the
# Secret Service (GNOME Keyring, KWallet) over D-Bus on Linux, with the kernel
# keyring in front of it. Only with the `system-keychain` feature.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native-sync-persistent", "crypto-rust"], optional = true }

[features]
default = ["system-keychain", "file-secrets"]
# `Keychain`, the desktop's `SecretStore`. The engine shared with the mobile
# app leaves it out: a phone's secret store is the platform's, behind the
# same trait. On iOS and Android the feature adds no code, as they have no
# system store here.
system-keychain = ["dep:keyring"]
# `FileSecrets`, a `SecretStore` in one owner-only `secrets.json`, optionally
# sealed: for computers with no secret service (a headless Linux server). The
# phones leave it out, like `system-keychain`. It adds no dependencies.
file-secrets = []
# `TestAuthenticator`, a software passkey for tests in this crate and the app.
test-support = []

[dev-dependencies]
# This crate's integration tests use `TestAuthenticator`. Default features off,
# so the phones' test build (`--no-default-features`) doesn't turn the desktop
# Keychain, and the binary that needs it, back on.
kanso-sync = { path = ".", default-features = false, features = ["test-support"] }
# A synced recording must be playable, so the two-device test exercises the real Ogg Opus reader.
kanso-audio = { path = "../kanso-audio" }
async-channel.workspace = true
# The rollback test replays the old app's store rules (tests/common/legacy.rs).
kanso-store = { workspace = true, features = ["legacy-v1-rules"] }
proptest.workspace = true
tempfile.workspace = true
