[package]
name = "kanso-server"
description = "Kanso's local HTTP API: REST endpoints that speak a widely used local-server API, and a native MCP endpoint."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
# The review queue tells the app when a suggestion arrives or goes.
async-channel.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64.workspace = true
# Today, in the computer's time zone, for daily notes.
chrono.workspace = true
# Agents' MCP tokens: 256 bits from the OS, kept only as SHA-256.
getrandom.workspace = true
# Caps the body of every route but an attachment upload's (`body_limit`).
http-body-util = "0.1"
futures-util = "0.3"
kanso-core.workspace = true
kanso-render.workspace = true
kanso-store.workspace = true
regex-lite = "0.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
proptest.workspace = true
rusqlite.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
