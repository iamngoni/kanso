[package]
name = "kanso-core"
description = "Kanso domain types: documents, IDs, revisions and the search-query language."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# A date and time with a zone (`zoned.rs`), resolved through the tz database.
chrono.workspace = true
chrono-tz.workspace = true
fastrand.workspace = true
md-5.workspace = true
# Query fences are found in the Markdown syntax tree, as the preview finds them.
markdown.workspace = true
# Find and replace across notes (`replace.rs`). The app already builds it.
regex.workspace = true
# Update notices name the first version that shows them (`notices.rs`).
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# A real YAML parser to check the subset Kanso reads.
saphyr = "0.2.2"
