[package]
name = "kanso-collab"
description = "Kanso's shared notes: end-to-end encrypted collaboration with merged edits, live cursors, comments and mentions, over the sync server."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
chacha20poly1305.workspace = true
curve25519-dalek.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hkdf.workspace = true
kanso-core.workspace = true
kanso-store.workspace = true
# Without the desktop Keychain: the phones' library (kanso-mobile) uses this
# crate and keeps its secrets elsewhere.
kanso-sync = { path = "../kanso-sync", default-features = false }
kanso-tls = { workspace = true, features = ["ureq"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
tungstenite.workspace = true
ureq = "3.4"
url = "2.5"
yrs.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
