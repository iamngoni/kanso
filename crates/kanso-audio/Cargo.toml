[package]
name = "kanso-audio"
description = "Recordings on disk: Opus in Ogg, written as they happen, and decoded back for playback and transcription."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Reads and writes Ogg pages and packets (BSD-3-Clause, pure Rust).
ogg = "0.9"
# The microphone on every platform: Core Audio, WASAPI and ALSA (the version
# kanso-voice uses).
cpal = "0.18"
fastrand.workspace = true
# The microphone callback hands samples over without locking or allocating.
rtrb = "0.3"
# The microphone's rate to Opus's 48 kHz.
rubato = "5"
serde.workspace = true
serde_json.workspace = true
# libopus (BSD-3-Clause) behind safe bindings (MIT/Apache-2.0). The bindings
# build the vendored libopus source with CMake, so a build host needs cmake
# on PATH (scripts/linux-deps.sh, and the release workflow's cmake step).
opus = "0.4"
# M4A, MP3, FLAC, WAV and the other formats Symphonia reads; Opus is not
# among them, which is why libopus is here. The same decoders as kanso-voice.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "caf", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror.workspace = true

# System audio on Linux is a monitor source, which cpal's ALSA host cannot
# list; its PulseAudio host (a pure-Rust protocol client, no libpulse) can,
# and PipeWire answers the same protocol through pipewire-pulse. Cargo
# unifies features, so kanso-voice's microphone prefers this host too when a
# sound server answers.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

[target.'cfg(target_os = "macos")'.dependencies]
# System audio on macOS: ScreenCaptureKit (one app's audio, no video) and the
# workspace's list of running apps. MIT/Apache-2.0/Zlib bindings to Apple's
# frameworks; GPUI already builds objc2 and block2.
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-audio-types"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSObject", "NSString"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "SCShareableContent", "SCStream"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
