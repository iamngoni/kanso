[package]
name = "kanso-app"
description = "The Kanso desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kanso"
path = "src/main.rs"

[features]
# Kanso Dev: its own name, bundle ID, data folder, Keychain service and API
# port, and no updates (docs/DEVELOPING.md). `scripts/bundle-macos.sh --dev`
# builds it; releases never do.
dev-flavour = []

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
# Pasted and dropped images go into the store as base64 attachments.
base64.workspace = true
chrono.workspace = true
fastrand.workspace = true
getrandom.workspace = true
# Mozilla's Public Suffix List (ICANN and private sections), compiled in:
# a passkey relying party may not be a public suffix such as workers.dev.
psl = "2"
# Icon theme packages and extensions come as .tgz / .tar.gz, unpacked in
# process with caps. Both are already built for the updater.
flate2 = "1.1"
# Quick capture's system-wide shortcut: Carbon's RegisterEventHotKey on
# macOS (no Accessibility permission), RegisterHotKey on Windows, and an X11
# key grab on Linux.
global-hotkey = "0.9"
gpui-kit.workspace = true
# Parses a provider's page before the system opener sees it.
url = "2.5"
# Pasted images the API doesn't take (TIFF, WebP, BMP) are stored as PNG.
# GPUI already builds these decoders.
image = { version = "0.25", default-features = false, features = ["png", "tiff", "webp", "bmp", "ico"] }
# Shared notes: end-to-end encrypted collaboration over the sync server.
kanso-ai.workspace = true
# Finding the agents Settings › AI lists; the fake agent for tests.
kanso-acp.workspace = true
kanso-collab.workspace = true
kanso-gallery.workspace = true
kanso-core.workspace = true
kanso-import.workspace = true
# Plugins (docs/PLUGINS.md): manifests, grants, the router and the
# supervisor of each plugin's sandboxed host process.
kanso-plugins = { path = "../kanso-plugins" }
kanso-render.workspace = true
kanso-server.workspace = true
kanso-sync.workspace = true
# Linux security keys (docs/ACCOUNTS.md › Where the ceremony runs): the
# libfido2 CTAP2 client. Pure everywhere else, where it finds no keys.
kanso-fido = { path = "../kanso-fido" }
kanso-update.workspace = true
kanso-voice.workspace = true
kanso-store.workspace = true
# Lock sessions, account flows and sync scheduling, without a window (issue #48).
kanso-engine.workspace = true
# The types `[[` autocomplete answers the text editor in. Pinned to the
# version gpui-base uses.
lsp-types = "=0.97.0"
markdown.workspace = true
# Related notes: Model2Vec static embeddings, computed on this device (MIT).
# Without its Hugging Face client or Oniguruma: `related.rs` fetches the
# model and checks it against pinned SHA-256s, and the tokenizer uses
# pure-Rust regexes.
model2vec-rs = { version = "=0.3.0", default-features = false }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
# Deriving the JSON schema of a tool's arguments for the model.
schemars = "0.8"
# The history dialog's changes between versions.
similar.workspace = true
sha2.workspace = true
# Model2Vec's tokenizer, at the version it uses, with pure-Rust regexes.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tree-sitter-c-sharp.workspace = true
tree-sitter-swift.workspace = true
tar = "0.4.45"
# A Zed extension's extension.toml, read for who made an imported icon
# theme and where it lives. Already built for other crates.
toml = "0.8"
# `kanso capture` hands its text to a running Kanso's local API, and the
# related-notes model downloads with it. The sync client already builds it.
ureq = "3.4"
# A passkey's PRF output and a security key's PIN are wiped after use.
zeroize.workspace = true

[dev-dependencies]
base64.workspace = true
# TestAuthenticator: a software passkey MemoryServer verifies.
kanso-sync = { workspace = true, features = ["test-support"] }
# The generators of the engine's view-state tests.
kanso-engine = { workspace = true, features = ["test-support"] }
# gpui-kit's own test-support feature also resolves its alternative GPUI
# backend, whose cocoa pin conflicts; enabling it on each layer is equivalent.
gpui-pre = { version = "=0.3.9", features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.9", features = ["test-support"] }
gpui-base = { version = "=0.7.3", features = ["test-support"] }
gpui-component = { version = "=0.7.3", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
proptest.workspace = true
# Makes the library refuse a write, to test a binding that fails.
rusqlite.workspace = true
tempfile.workspace = true
# Names the item type of a test Keychain that wraps MemorySecrets.
zeroize.workspace = true

# The PRF input, CTAP salt and client data are written in three crates; a
# test keeps them equal (`key_constants_tests.rs`).
kanso-webauthn = { path = "../kanso-webauthn" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# Native platform passkeys: AuthenticationServices on macOS, webauthn.h on
# Windows (`passkey_ceremony.rs`). Linux has no platform passkeys.
kanso-webauthn = { path = "../kanso-webauthn" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Real text shaping for the PNG snapshots, without the main-thread-only platform.
gpui-pre-apple = "=0.3.9"

[target.'cfg(target_os = "macos")'.dependencies]
# PDF export: WebKit lays the exported page out and makes the PDF
# (WKWebView printing, and createPDF). GPUI already links objc2 and block2.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphics", "NSOpenPanel", "NSPanel", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSSavePanel", "NSSpellChecker", "NSView", "NSWindow", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSCalendar", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSRange", "NSString", "NSURL"] }
# Open at login with SMAppService on macOS 13 and later.
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
# Reminders: whether notifications are allowed, asked only inside an app
# bundle (GPUI already links it).
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings"] }
# Text in images: Vision reads the words in image attachments (`ocr.rs`).
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKPDFConfiguration", "WKNavigation"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The window a passkey sheet belongs to (its HWND).
raw-window-handle = "0.6"
# Windows Hello unlocks locked notes (`touch_id.rs`): UserConsentVerifier,
# asked over Kanso's window. The version GPUI already builds.
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"
# Gives `kanso serve` and the other commands the console they were run from:
# the release build is a GUI program without a console of its own.
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    # Reading the clipboard's CF_HTML for pasting formatted text.
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # Open at login: the Run key under HKEY_CURRENT_USER.
    "Win32_System_Registry",
    # The Dictate button: voice typing's shortcut, Windows key + H.
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
# Reads themes/index.json, which lists the built-in color themes.
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
# The app icon in kanso.exe.
embed-resource = "3"
