[package]
name = "kanso-engine"
description = "Kanso's engine without a window: lock sessions, account flows and sync scheduling, shared by the desktop app and the mobile app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# `export` and `publish` fail with context (export.rs).
anyhow.workspace = true
# The changes a store tells its listeners (discovery/indexer.rs): the same
# channel `kanso-store` sends them on.
async-channel.workspace = true
# Google's PKCE challenge (account/provider.rs) and attachments' bytes
# (attach.rs).
base64.workspace = true
# The recovery-key file's date and the resume time (account/words.rs).
chrono.workspace = true
fastrand.workspace = true
# Images the API doesn't take (TIFF, WebP, BMP) are attached as PNG
# (attach.rs). GPUI already builds these decoders for the desktop app.
image = { version = "0.25", default-features = false, features = ["png", "tiff", "webp", "bmp", "ico"] }
kanso-core.workspace = true
# A note's web page (`export`, `publish`) and Excalidraw scenes as a note
# keeps them, and image widths (edit/image.rs).
kanso-render.workspace = true
kanso-store.workspace = true
# Without the desktop Keychain: secrets go through the `Secrets` trait.
kanso-sync = { path = "../kanso-sync", default-features = false }
# The editor's settings, as the config file writes them (editor_settings.rs).
serde.workspace = true
# Theme files are written with their keys in the order the format lists them
# (theme/file.rs), which a map keeps only with `preserve_order`.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
# The shared providers and prompt rules, without the desktop's ACP agent.
kanso-ai = { path = "../kanso-ai", optional = true, default-features = false }
# Filters answer Markdown before the phone renders it.
markdown = { workspace = true, optional = true }
# Argument schemas for the tools exposed during Ask.
schemars = { version = "0.8", optional = true }
# What changed between a saved version and the note (history/diff.rs).
similar.workspace = true
# Vim keys step over a character as it is read, a grapheme cluster
# (edit/vim/text.rs).
unicode-segmentation = "1.13"
# Column widths of table cells (edit/table.rs).
unicode-width.workspace = true
# HTML on the clipboard pasted as Markdown (Apache-2.0; edit/paste.rs).
htmd = "0.5.6"
# The generators the apps' view tests share (strategies.rs).
proptest = { workspace = true, optional = true }

# Discovery (discovery/): related notes' embedding model and the download that
# fetches it. Their dependencies build for iOS and Android with the same
# compilers as SQLite's.
# Without its Hugging Face client or Oniguruma: `discovery::related` fetches
# the model and checks it against pinned SHA-256s, and the tokenizer uses
# pure-Rust regexes.
model2vec-rs = { version = "=0.3.0", default-features = false, optional = true }
# Model2Vec's tokenizer, at the version it uses, with pure-Rust regexes.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }
# The model downloads over HTTPS (discovery::model_fetch), trusting what
# `kanso-tls` says: the web's roots on a computer, the phone's own store on
# iOS and Android. The sync client already builds both.
kanso-tls = { workspace = true, features = ["ureq"], optional = true }
ureq = { version = "3.4", optional = true }

# Highlighting (highlight/): the runtime and the Markdown grammar, then a
# grammar for each language a fence names. Their C code builds for iOS and
# Android with the same compilers as SQLite's.
tree-sitter = { workspace = true, optional = true }
tree-sitter-md = { workspace = true, optional = true }
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-css = { workspace = true, optional = true }
tree-sitter-diff = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-html = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-kotlin-sg = { workspace = true, optional = true }
tree-sitter-lua = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-sequel = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
tree-sitter-toml-ng = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }

[build-dependencies]
# build.rs reads themes/index.json to list the built-in themes.
serde_json.workspace = true

[features]
default = ["highlight", "code-grammars", "ai"]
# `highlight`: Markdown source and preview colors (a `Token` per span), with
# the Markdown grammar alone.
highlight = ["dep:tree-sitter", "dep:tree-sitter-md"]
# `code-grammars`: the 23 other grammars, for fenced code, front matter and
# HTML blocks.
code-grammars = [
    "highlight",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-c",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-css",
    "dep:tree-sitter-diff",
    "dep:tree-sitter-go",
    "dep:tree-sitter-html",
    "dep:tree-sitter-java",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-kotlin-sg",
    "dep:tree-sitter-lua",
    "dep:tree-sitter-php",
    "dep:tree-sitter-python",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-sequel",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-yaml",
]
# `discovery`: the graph, the embedding model with its download and indexer,
# the meaning of a note and reading the words in images.
discovery = ["dep:model2vec-rs", "dep:tokenizers", "dep:kanso-tls", "dep:ureq"]
# Ask, the inline assistant and note summary; both app surfaces share the
# same retrieval eligibility and safe-answer rules.
ai = ["dep:kanso-ai", "dep:markdown", "dep:schemars"]
# `strategies`: generators for kanso-app's view tests.
test-support = ["dep:proptest"]

[dev-dependencies]
# An export read back by the importer (export.rs).
kanso-import.workspace = true
proptest.workspace = true
tempfile.workspace = true
# A store that refuses a write, to test a binding that fails.
rusqlite.workspace = true
