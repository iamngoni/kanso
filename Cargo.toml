[workspace]
resolver = "3"
members = ["crates/*", "mobile/rust"]

[workspace.package]
version = "0.8.4"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
kanso-acp = { path = "crates/kanso-acp" }
kanso-ai = { path = "crates/kanso-ai" }
kanso-core = { path = "crates/kanso-core" }
kanso-engine = { path = "crates/kanso-engine" }
kanso-store = { path = "crates/kanso-store" }
kanso-import = { path = "crates/kanso-import" }
kanso-server = { path = "crates/kanso-server" }
kanso-sync = { path = "crates/kanso-sync" }
kanso-tls = { path = "crates/kanso-tls" }
kanso-update = { path = "crates/kanso-update" }
kanso-render = { path = "crates/kanso-render" }
kanso-voice = { path = "crates/kanso-voice" }
kanso-collab = { path = "crates/kanso-collab" }
kanso-gallery = { path = "crates/kanso-gallery" }
kanso-mobile = { path = "crates/kanso-mobile" }
# The provider layer: OpenAI, Anthropic, Gemini, Cohere, Bedrock and every
# OpenAI-compatible endpoint, with streaming, tools and typed timeouts. Pinned
# to a commit on its master.
agent-runtime = { git = "https://github.com/iamngoni/agent-runtime", rev = "091fd80a6282b6d08db2f40dcb3876f592fae9e3" }

aes = "0.8"
# Published notes (kanso-sync share.rs): AES-256-GCM, which browsers open with WebCrypto.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
anyhow = "1"
# Accounts with end-to-end encryption (docs/ACCOUNTS.md › Rust crates): RustCrypto on the
# digest 0.11 generation. `parallel` runs Argon2's lanes on rayon (about 3.6 times faster).
argon2 = { version = "0.6", default-features = false, features = ["alloc", "parallel", "zeroize"] }
async-channel = "2.5"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
# Shared notes (docs/ACCOUNTS.md › Collaboration): X25519 receives note keys, Ed25519 signs
# what each member writes. Both were already in Cargo.lock.
curve25519-dalek = "5.0"
ed25519-dalek = { version = "3.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
flate2 = "1.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
fastrand = "2"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
# The Markdown parser gpui-base uses, pinned to its version: the preview finds
# blocks where the text view does.
markdown = { version = "=1.0.0", features = ["serde"] }
md-5 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
proptest = "1.12"
prost = "0.14"
regex = "1.11"
similar = { version = "2.7", features = ["inline"] }
semver = "1.0"
# The live channel of shared notes: a WebSocket over the rustls (ring) and web PKI roots
# ureq already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40", features = ["bundled", "functions", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
unicode-normalization = "0.1"
# Column widths of table cells (kanso-engine, `edit::table`): CJK characters and
# most emoji take two.
unicode-width = "0.2"
webpki-roots = "1"
# The CRDT of shared notes (MIT), wrapped by kanso-collab so it can be swapped.
yrs = "0.28"
zeroize = "1.9"
# Grammars for the Markdown source and for code blocks in the editor and the
# preview (`code_lang.rs` maps fence names onto them). There is no Dart
# grammar in gpui-kit; every other common language is here.
gpui-kit = { version = "=0.7.3", features = [
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
# Only for their highlight queries: gpui-kit compiles these two grammars in
# without one (`code_lang::ensure_registered`). Pinned to the versions it uses.
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-swift = "=0.7.4"
# The engine's own Markdown highlighter (kanso-engine, `highlight`), on the
# runtime and grammar crates gpui-kit's component library compiles in. The
# requirements equal that library's, version for version: the runtime
# declares `links = "tree-sitter"` and every grammar exports unmangled C
# symbols, so a second copy of either fails to link. CI fails if
# `cargo tree -d -p kanso-app` lists a tree-sitter crate twice.
tree-sitter = "0.26.13"
tree-sitter-bash = "0.23.3"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.23.2"
tree-sitter-diff = "0.1.0"
tree-sitter-go = "0.23.4"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.23.1"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-sg = "0.4.0"
tree-sitter-lua = "0.4.1"
tree-sitter-md = "0.5.1"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.23.6"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.0"
tree-sitter-sequel = "0.3.8"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "symbols"

# The phones' libraries (#48): as small as possible, and unwinding, so the
# facade catches a panic and returns it as an error. The desktop ships with
# [profile.release] above, unchanged. Build with `cargo build --profile mobile`.
[profile.mobile]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# GPUI Kit's component crate with one small hook added, so an icon theme
# restyles the component library's own icons too, and its text view with
# another, so the preview can tick a task box (vendor/README.md).
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
